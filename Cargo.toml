[workspace]
members = ["crates/algal", "crates/algal-expr"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# CI-only: the application parity binary. Optimized like release, but it
# keeps debug assertions and overflow checks so parity exercises the same
# checked arithmetic as a debug build. Never used for shipped binaries.
[profile.ci-parity]
inherits = "release"
debug-assertions = true
overflow-checks = true
lto = false
codegen-units = 16
incremental = false
