name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run check

  coding-harness:
    name: Coding harness adapter
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - run: python -m pip install -r examples/coding-harness/requirements-harbor.txt
      - run: python -m unittest discover -s examples/coding-harness -p 'test_*.py'

  surface-renderers:
    name: Surface renderer contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - run: rustup default 1.97.1
      - run: bun examples/malleable-site/renderers/fixtures/generate.ts --check
      - run: cargo fmt --manifest-path examples/malleable-site/renderers/Cargo.toml -- --check
      - run: cargo test --manifest-path examples/malleable-site/renderers/Cargo.toml --locked
      - run: cargo clippy --manifest-path examples/malleable-site/renderers/Cargo.toml --locked --all-targets -- -D warnings

  native:
    name: Native VM (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - run: rustup default 1.97.1
      - run: bun install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --locked
      - run: ALGAL_MEMORY_NATIVE="$PWD/target/debug/algal" bun test examples/coding-harness/memory-records.test.ts examples/coding-harness/memory.test.ts
      - run: ALGAL_MEMORY_NATIVE="$PWD/target/debug/algal" bun test examples/adaptive-inventory/run.test.ts
      - run: bun scripts/native-parity.ts
      - run: bun scripts/application-parity.ts
      - run: bun scripts/process-parity.ts
      - run: bun scripts/store-parity.ts
      - run: bun scripts/cli-parity.ts
      - run: bun scripts/inference-parity.ts
      - run: bun examples/malleable-site/parity.ts
      - run: bun scripts/source-inspection-parity.ts
      - run: bun scripts/schema-parity.ts
      - run: bun scripts/compilation-parity.ts
      - run: bun scripts/work-budget-parity.ts
      - run: bun scripts/mailbox-admission-parity.ts
      - run: bun scripts/vm-demo.ts --native ./target/debug/algal
      - run: bun scripts/recovery-demo.ts --native ./target/debug/algal
      - run: bun scripts/repair-demo.ts --native ./target/debug/algal
      - run: bun scripts/coding-recovery-demo.ts --native ./target/debug/algal
      - run: bun scripts/process-evidence-demo.ts --native ./target/debug/algal
      - run: cargo build --release --locked -p algal --bin algal
      - run: python3 scripts/test_apple_brief_demo.py --native "$PWD/target/release/algal" --out "$RUNNER_TEMP/algal-private-brief-fixture"
      - run: python3 scripts/test-native-release.py --binary target/release/algal --commit "$GITHUB_SHA" --rustc-version "$(rustc --version)"
