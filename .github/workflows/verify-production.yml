name: Production public site browser
# Runs after every successful Vercel Production deployment, and on demand.
# Vercel also reports Preview deployments; those runs skip every job.
on:
  workflow_dispatch:
  deployment_status:
permissions:
  contents: read
concurrency:
  group: production-public-browser-${{ github.event_name }}-${{ github.event.deployment.environment || 'dispatch' }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  browser:
    name: Production browser
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment.environment == 'Production' && github.event.deployment_status.state == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install locked verifier dependencies
        working-directory: .
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Provision the locked Playwright browser
        run: |
          set -euo pipefail
          sudo python3 scripts/browser_acquisition.py
          config=/etc/apt/apt.conf.d/99-browser-acquisition
          sudo test ! -e "$config"
          sudo test ! -L "$config"
          trap 'sudo rm -f "$config"' EXIT
          printf '%s\n' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' 'Acquire::Retries "1";' | sudo tee "$config" >/dev/null
          bun ./node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Inspect public production pages without writes
        run: bun site/scripts/check-production-browser.mjs
      - name: Retain production screenshots and receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-public-browser
          path: site/.production-browser/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
  # Not named `Required`: that name is the branch policy's check, and this
  # workflow reports on deployed commits, never on pull request heads.
  verdict:
    name: Production browser verdict
    if: always() && needs.browser.result != 'skipped'
    needs: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require live public browser verification
        env:
          RESULT: ${{ needs.browser.result }}
        run: test "$RESULT" = success
