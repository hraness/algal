[package]
name = "algal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Typed, bounded, replayable agent programs"

[lints]
workspace = true

[dependencies]
algal-expr = { path = "../algal-expr" }
apple-foundation = { git = "https://github.com/hraness/apple-foundation", tag = "v0.1.3" }
clap = { version = "=4.5.48", features = ["derive"] }
getrandom = "=0.3.4"
libc = "=0.2.189"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
ryu-js = "=1.0.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokio = { version = "=1.47.1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "signal"] }

[dev-dependencies]
# Keep the engine in this reviewed Cargo.lock and native test artifact; the
# default dynamic engine performs a separate ungoverned shim build.
hegeltest = { version = "=0.46.1", features = ["static-engine"] }
tempfile = "=3.23.0"

[build-dependencies]
sha2 = "=0.10.9"
