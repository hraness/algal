[package]
name = "algal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ALGAL is a programming language and VM for AI agent programs that wait for approval and leave receipts you can replay."

[lints]
workspace = true

[dependencies]
anyhow = "1"
hraness-cli-update = { git = "https://github.com/hraness/cli-update", tag = "v0.1.0", version = "=0.1.0" }
algal-expr = { path = "../algal-expr" }
apple-foundation = { git = "https://github.com/hraness/apple-foundation", tag = "v0.2.0" }
clap = { version = "=4.5.48", features = ["derive"] }
getrandom = "=0.3.4"
hraness-cli-kit = { git = "https://github.com/hraness/desktop-foundation", tag = "v1.1.2", features = ["clap"] }
libc = "=0.2.189"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
ryu-js = "=1.0.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tokio = { version = "=1.47.1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "sync", "time", "signal"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
tempfile = "=3.23.0"

[build-dependencies]
sha2 = "=0.10.9"
