[package]
name = "algal-surface-renderers"
version = "0.0.0"
edition = "2024"
publish = false

# This feasibility experiment deliberately does not enlarge ALGAL's kernel workspace.
[workspace]

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]
dioxus-ui = ["dep:dioxus"]
web = ["dioxus-ui", "dioxus/web"]
desktop = ["dioxus-ui", "dioxus/desktop"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
dioxus = { version = "=0.7.10", optional = true, default-features = false, features = ["macro", "html", "signals", "hooks", "launch"] }
ratatui = { version = "=0.30.2", optional = true, default-features = false, features = ["crossterm", "crossterm_0_29", "unstable-rendered-line-info"] }
crossterm = { version = "=0.29.0", optional = true }

[[bin]]
name = "surface-tui"
path = "src/bin/tui.rs"
required-features = ["tui"]

[[bin]]
name = "surface-dioxus"
path = "src/bin/dioxus.rs"
required-features = ["dioxus-ui"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
