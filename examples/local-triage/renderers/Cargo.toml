[package]
name = "algal-triage-renderers"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]
desktop = ["dep:dioxus", "dioxus/desktop"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
dioxus = { version = "=0.7.10", optional = true, default-features = false, features = ["macro", "html", "signals", "hooks", "launch"] }
ratatui = { version = "=0.30.2", optional = true, default-features = false, features = ["crossterm", "crossterm_0_29", "unstable-rendered-line-info"] }
crossterm = { version = "=0.29.0", optional = true }

[[bin]]
name = "triage-tui"
path = "src/bin/tui.rs"
required-features = ["tui"]

[[bin]]
name = "triage-desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
